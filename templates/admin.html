{% extends 'base.html' %}{% block title %}账号管理{% endblock %}{% block content %}<h1>账号管理</h1><p>仅管理员可访问。密码以哈希持久化到 SQLite，重启不会重建或覆盖账号。</p><section><h2>新增账号</h2><form method="post" class="filters"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>用户名<input name="username" required minlength="2" maxlength="32" autocomplete="off"></label><label>密码<input type="password" name="password" required minlength="6" maxlength="128" autocomplete="new-password"></label><label>角色<select name="role"><option value="user">普通用户</option><option value="admin">管理员</option></select></label><button class="primary">创建账号</button></form></section><section><h2>已有账号</h2><table><thead><tr><th>ID</th><th>用户名</th><th>角色</th></tr></thead><tbody>{% for user in users %}<tr><td>{{ user.id }}</td><td>{{ user.username }}</td><td>{{ '管理员' if user.role=='admin' else '普通用户' }}</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
